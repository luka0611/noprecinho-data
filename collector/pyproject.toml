[project]
name = "noprecinho-collector"
version = "0.1.0"
description = "Polite collector for public receipt-based prices (Preço da Hora Bahia) for No Precinho"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
]

[project.scripts]
noprecinho = "noprecinho_collector.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noprecinho_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
